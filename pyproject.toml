[project]
name = "bilstm-experimentos"
version = "0.1.0"
description = "Notebooks and tools for reproducible video conflict detection experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "tomli-w>=1.0",
]

[dependency-groups]
data = [
    "kaggle>=2.2.5",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
training = [
    "opencv-python-headless>=4.10,<5",
    "torch>=2.5,<2.8",
    "torchvision>=0.20,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilstm_pipeline"]
