[project]
name = "bilstm-experimentos"
version = "0.1.0"
description = "Notebooks e ferramentas para experimentos reproduzíveis de detecção de conflitos em vídeo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
package = false
