# External evaluation configuration for RWF-2000 (vulamnguyen/rwf2000 on Kaggle). / Configuração de avaliação externa para o RWF-2000 (vulamnguyen/rwf2000 no Kaggle).
[data]
root = "data/raw/rwf2000-v1"
manifest = "data/processed/rwf2000-external.json"

[split]
train = 0.64
validation = 0.16
test = 0.20
seed = 42

[video]
frames = 15
width = 100
height = 100

[model]
backbone = "mobilenet_v2"
pretrained = true
trainable_layers = 80
pooling = "avg"
temporal_head = "bilstm"
hidden_size = 32
attention = true
dense_units = [256, 128, 64, 32]
dropout = 0.25

[training]
epochs = 100
batch_size = 64
optimizer = "sgd"
learning_rate = 0.01
momentum = 0.9
weight_decay = 0.0
lr_factor = 0.6
lr_patience = 5
min_learning_rate = 0.00005
early_stopping_patience = 10
seed = 42
device = "cuda"
num_workers = 0

[evaluation]
threshold = 0.5
bootstrap_resamples = 1000

[robustness]
brightness_delta = -0.1
contrast_factor = 0.8
noise_sigma = 0.05
occlusion_fraction = 0.1
jpeg_quality = 50
video_crf = 28
